<html lang="zh-Hant-TW">
<head>

<title>資歷累積類型檢查</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE everyday, quiet and confident: a private conversation, not a sales page
   IDEA the book cover: 資歷 as a grey hourglass, 資產 as a gold diamond
   PICTURE line-drawn hourglass turning into a diamond; result shown as a marker on that same path
   COLOUR near-black ground, warm ivory ink, brand gold, one muted grey for 資歷
   TYPE Noto Serif TC for titles + Noto Sans TC for text
   LAYOUT one calm column; picture above the title on phone, beside it from 760px */
:root{color-scheme:dark;--bg:#0c0b09;--bg2:#15130f;--ink:#f3ede2;--soft:#b9b0a1;--mute:#8a8378;--gold:#c9a45c;--gold2:#e6c98a;--line:#2c2820;--grey:#7d7a74}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Noto Serif TC","Songti TC",serif;font-weight:700;line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,6vw,46px);letter-spacing:.01em}
h2{font-size:clamp(24px,4.6vw,32px)}
h3{font-size:20px;color:var(--gold2)}
p{margin:0 0 1em;text-wrap:pretty}
.nw{white-space:nowrap}
li,h2,h3{text-wrap:pretty}
a{color:var(--gold2)}
.wrap{max-width:760px;margin:0 auto;padding:clamp(28px,6vw,64px) max(5vw,20px)}
.screen{display:none}
.screen.on{display:block;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.on{animation:none}}
.hero{display:grid;gap:28px;align-items:center}
.hero{display:grid;gap:clamp(24px,4vw,56px);align-items:center;padding-top:clamp(8px,4vh,48px)}
@media(min-width:760px){.hero{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr)}.hero .cover{order:2}}
.cover img{display:block;width:100%;max-width:300px;height:auto;margin:0 auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
@media(max-width:759px){.cover img{max-width:170px}}
.hero h1{font-size:clamp(28px,6vw,42px)}
.lead{color:var(--soft);font-size:18px;margin-top:16px}
.meta{color:var(--mute);font-size:15px;margin:22px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border:1px solid var(--gold);background:var(--gold);color:#16120a;font:700 17px/1 "Noto Sans TC",sans-serif;border-radius:999px;cursor:pointer;text-decoration:none;transition:background .2s,color .2s}
.btn:hover{background:var(--gold2);border-color:var(--gold2)}
.btn:focus-visible,.opt:focus-visible,.ghost:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.btn.line{background:transparent;color:var(--gold2)}
.btn.line:hover{background:var(--gold);color:#16120a}
.ghost{background:none;border:0;color:var(--mute);font:15px "Noto Sans TC",sans-serif;cursor:pointer;padding:10px 0;min-height:44px}
.ghost:hover{color:var(--ink)}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--grey),var(--gold));transition:width .35s}
.count{color:var(--mute);font-size:15px;display:flex;justify-content:space-between;align-items:center}
.q{margin:26px 0 22px}
.opts{display:grid;gap:12px}
.opt{text-align:left;width:100%;min-height:60px;padding:16px 20px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;color:var(--ink);font:17px/1.6 "Noto Sans TC",sans-serif;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:#1d1a13}
form{display:grid;gap:22px;margin-top:26px}
label.f{display:grid;gap:8px;font-weight:500}
input[type=text],input[type=email]{font:17px "Noto Sans TC",sans-serif;padding:14px 16px;background:var(--bg2);color:var(--ink);border:1px solid #3a352b;border-radius:12px;min-height:52px;width:100%}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px}
legend{font-weight:500;margin-bottom:8px}
.radio{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.radio input{width:20px;height:20px;accent-color:var(--gold)}
.err{color:#e59a7a;font-size:15px;min-height:1.5em;margin:-8px 0 0}
.note{color:var(--mute);font-size:14px;line-height:1.7}
.rtop{padding-bottom:8px}
.rtag{color:var(--gold);font-weight:500;margin-bottom:8px}
.gauge{margin:30px 0 8px}
.track{position:relative;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--grey),#a08a5c,var(--gold))}
.dot{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 5px #0c0b09,0 0 0 6px var(--gold);transition:left .8s ease}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px;font-size:14px;color:var(--mute)}
.zones span:nth-child(2){text-align:center}.zones span:nth-child(3){text-align:right}
.zones .me{color:var(--gold2);font-weight:700}
.sec{border-top:1px solid var(--line);padding-top:30px;margin-top:34px}
.sec h2{margin-bottom:16px}
.list{list-style:none;padding:0;margin:0;display:grid;gap:18px}
.list li b{display:block;color:var(--ink);font-size:18px;margin-bottom:2px}
.list li span{color:var(--soft)}
.bul{padding-left:1.2em;margin:0 0 1em;color:var(--soft)}
.bul li{margin:4px 0}
.quote{font-family:"Noto Serif TC",serif;font-size:21px;line-height:1.6;color:var(--gold2);margin:0 0 14px}
.src{font-size:13px;color:var(--mute)}
.ex{counter-reset:n;list-style:none;padding:0;margin:0 0 1em;display:grid;gap:14px}
.ex li{counter-increment:n;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px}
.ex li::before{content:counter(n);font-family:"Noto Serif TC",serif;font-size:22px;color:var(--gold);line-height:1.5}
.offer{padding:26px 0;border-bottom:1px solid var(--line)}
.offer:last-child{border-bottom:0}
.pick{display:inline-block;color:#16120a;background:var(--gold);font-size:14px;font-weight:700;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.price{font-size:18px;margin:4px 0 10px}
.price s{color:var(--mute);font-size:15px;margin-left:8px}
.fit{color:var(--ink);font-weight:500;margin:10px 0 4px}
.offer .btn{margin-top:10px}
.letter{background:var(--bg2);border-radius:18px;padding:clamp(22px,4vw,34px);margin-top:38px}
.sign{margin-top:18px;color:var(--soft)}
.sign b{color:var(--ink);display:block;font-weight:500}
.foot{color:var(--mute);font-size:13px;margin-top:34px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center}
.rhead{padding-bottom:6px}
.rhead h1{margin-top:6px}
.gends{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.gends svg{width:28px;height:28px}
.dims{display:grid;gap:22px;margin-top:6px}
.dim{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:6px 16px;align-items:center}
.dim b{font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.seg i{height:10px;border-radius:5px;background:#24211b}
.seg i.on1{background:var(--grey)}
.seg i.on2{background:#a08a5c}
.seg i.on3{background:var(--gold)}
.dim p{grid-column:2;margin:0;color:var(--soft);font-size:15px;line-height:1.6}
.seglbl{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:16px;font-size:13px;color:var(--mute)}
.seglbl span{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.seglbl span em{font-style:normal;text-align:center}
.hl{display:grid;gap:14px;margin-top:26px}
@media(min-width:620px){.hl{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.hl div{background:var(--bg2);border-radius:14px;padding:18px 20px}
.hl small{display:block;color:var(--mute);font-size:14px;margin-bottom:4px}
.hl strong{font-family:"Noto Serif TC",serif;font-size:20px;color:var(--gold2);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
@media(max-width:600px){body{font-size:16px}.lead{font-size:17px}.opt{font-size:16px}.dim{grid-template-columns:minmax(0,1fr)}.dim p{grid-column:1}.seglbl{grid-template-columns:minmax(0,1fr)}.seglbl>b{display:none}}
@media print{
:root{--bg:#fff;--bg2:#f6f3ec;--ink:#1a1712;--soft:#4a453c;--mute:#6b665d;--line:#ddd6c8;--gold:#9a7a34;--gold2:#8a6a24}
body{background:#fff;color:#1a1712;font-size:12pt}
.tools,.foot button,.offer .btn,#again{display:none!important}
.screen{display:none!important}#report{display:block!important;animation:none}
.sec,.offer,.letter,.dim{break-inside:avoid}
.dot{box-shadow:0 0 0 4px #fff,0 0 0 5px #9a7a34}
}
</style>
</head>
<body>
<main class="wrap">

<section id="intro" class="screen on">
  <div class="hero">
    <div class="cover"><img src="cover.webp" alt="《把資歷變資產》書封" width="560" height="821"></div>
    <div>
      <h1>你的資歷，<br><span style="white-space:nowrap">正在變成資產嗎？</span></h1>
      <p class="lead">同樣的年資，累積的方式不同，十年後的價值就完全不同。用 7 個問題，看看你現在<span class="nw">站在哪裡。</span></p>
      <button class="btn" id="start" type="button">開始回答</button>
      <p class="meta">7 題，約 2 分鐘。沒有標準答案，請選最接近你「現在實際做法」的選項，而不是你覺得<span class="nw">「應該」怎麼做。</span></p>
    </div>
  </div>
</section>

<section id="quiz" class="screen" aria-live="polite">
  <div class="prog"><i id="bar"></i></div>
  <div class="count"><span id="num"></span><button class="ghost" id="back" type="button">← 上一題</button></div>
  <h2 class="q" id="qtext"></h2>
  <div class="opts" id="opts"></div>
</section>

<section id="lead" class="screen">
  <h2 id="ltitle">你是<span style="color:var(--gold2)">偏資歷型人才</span></h2>
  <p class="lead">留下稱呼和 Email，免費領取你<span class="nw">完整的結果報告。</span></p>
  <form id="form" novalidate>
    <label class="f" for="name">怎麼稱呼你？<input type="text" id="name" autocomplete="given-name" required></label>
    <label class="f" for="email">Email<input type="email" id="email" autocomplete="email" inputmode="email" required></label>
    <fieldset>
      <legend>你目前的身分是？</legend>
      <label class="radio"><input type="radio" name="role" value="一般工作者" checked>一般工作者</label>
      <label class="radio"><input type="radio" name="role" value="主管">主管</label>
      <label class="radio"><input type="radio" name="role" value="企業主或HR">企業主或 HR</label>
    </fieldset>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" type="submit">看我的報告</button>
    <p class="note">送出後，你會收到「職涯資產健檢 AI 指令」，以及 Ginger 的電子報「幕僚觀察隨筆」，每月一篇，從經營層的視角看人才與職場。你的資料只用於寄送報告與相關內容，不會提供給第三方，可隨時取消訂閱。</p>
  </form>
</section>

<section id="report" class="screen"></section>

</main>

const R = {
 1:{tag:"偏資歷型",title:"你很努力，只是累積還沒被看見",
  means:`<p>在 7 個面向裡，你有比較多的答案落在「資歷型」這一邊。通常這代表：</p><ul class="bul"><li>你做事認真、可靠，是交辦事情時讓人放心的人</li><li>你的價值很大一部分，來自你熟悉的職位、流程和資源</li><li>你習慣把眼前的事做好，比較少停下來想「這些經驗，正在累積成什麼」</li></ul><p>這不是缺點。很多組織的穩定，正是靠這樣的人撐起來的。只是當環境開始變動，例如組織調整、新工具、新主管，你可能會比別人更早感到不安。不是因為你不夠好，而是你還說不清楚：自己真正值錢的是什麼。</p>`,

function sendKit(name,email,role,t,s){
  return new Promise(done=>{
  const fid = CONFIG.kitForms[t];
  if(!fid){ done(); return; }
  const sink = document.querySelector('iframe[name=kit_sink]');
  let fin=false; const end=()=>{ if(!fin){ fin=true; done(); } };
  if(sink) sink.addEventListener('load', end, {once:true});
  setTimeout(end, 3000);
  try{
    const f = document.createElement('form');
    f.method='POST'; f.action=`https://app.kit.com/forms/${fid}/subscriptions`; f.target='kit_sink'; f.style.display='none';
    const add=(k,v)=>{const x=document.createElement('input');x.type='hidden';x.name=k;x.value=v;f.appendChild(x);};
    add('email_address',email); add('first_name',name);
    add('fields[role]',role); add('fields[result]',R[t].tag); add('fields[score]',String(s)); add('fields[answers]',code());
    document.body.appendChild(f); f.submit(); setTimeout(()=>f.remove(),3000);
  }catch(e){ end(); }
  });
}

function noOrphan(root){
  root.querySelectorAll('p, .bul li, .ex li div, .list li span').forEach(el=>{
    if(el.querySelector('.nw:last-child')) return;
    const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); let last=null,n;
    while((n=w.nextNode())) if(n.nodeValue.trim()) last=n;
    if(!last || last.parentNode.classList?.contains('nw')) return;
    const v=last.nodeValue.replace(/\s+$/,''); if(v.length<8) return;
    const cut=v.length-5, sp=document.createElement('span'); sp.className='nw'; sp.textContent=v.slice(cut);
    last.nodeValue=v.slice(0,cut); last.parentNode.insertBefore(sp,last.nextSibling);
  });
}

  const rk = DIM.map((d,k)=>[d,ans[k]]).filter(([d,v])=>v===mn && v<2).slice(0,2);
  const op = DIM.map((d,k)=>[d,ans[k]]).filter(([d,v])=>v===mx && v===2).slice(0,2);
  const fixL = a => `<ul class="list">${a.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')}</ul>`;
  const risk = r.riskFix ? fixL(r.riskFix) : rk.length ? `<ul class="list">${rk.map(([d])=>`<li><b>${d.n}</b><span>${d.r}</span></li>`).join('')}</ul>` : items(r.stuck);
  const opp = r.oppFix ? fixL(r.oppFix) : op.length ? `<ul class="list">${op.map(([d])=>`<li><b>${d.n}</b><span>${d.o}</span></li>`).join('')}</ul>` : `<p>${r.opp}</p>`;
  const hl = mx===mn ? '' : `<div class="hl"><div><small>你最接近資產型的面向</small><strong>${top}</strong></div><div><small>最值得先調整的面向</small><strong>${low}</strong></div></div>`;
  const dims = `<div class="seglbl"><b></b><span>${zone.map(z=>`<em>${z}</em>`).join('')}</span></div><div class="dims">${DIM.map((d,k)=>`<div class="dim"><b>${d.n}</b><div class="seg">${[0,1,2].map(v=>`<i class="${v===ans[k]?'on'+(v+1):''}"></i>`).join('')}</div><p>${d.t[ans[k]]}</p></div>`).join('')}</div>${hl}`;
  $('report').innerHTML = `
  <div class="rhead"><p class="rtag">${name?name+'，':''}你的資歷累積類型分析報告｜${r.tag}</p><h1>${r.title.split('，').map((p,k,a)=>`<span class="nw">${p}${k<a.length-1?'，':''}</span>`).join('')}</h1></div>
  <div class="gauge" aria-label="你的位置：${r.tag}"><div class="gends">${ICON_H}${ICON_D}</div><div class="track"><span class="dot" id="dot" style="left:0%"></span></div>
  <div class="zones">${zone.map((z,k)=>`<span class="${k+1===t?'me':''}">${z}</span>`).join('')}</div></div>
  <p class="note">這不是在幫你打分數，也不是評估你的能力或價值。這份報告反映的是你「現在」累積經驗的模式，它會隨著你的選擇改變，三個月後再測一次，結果可能就不一樣。</p>
  <div class="sec"><h2>你在 7 個面向的位置</h2>${dims}</div>
  <div class="sec"><h2>這個結果代表什麼</h2>${r.means}</div>
  <div class="sec"><h2>你已經擁有的優勢</h2>${items(r.plus)}</div>
  <div class="sec"><h2>潛在風險</h2>${risk}</div>
  <div class="sec"><h2>機會點</h2>${opp}</div>
  ${r.ibm?IBM:''}
  <div class="sec"><h2>留給你的${["","一","兩","三","四","五"][r.qs.length]}個問題</h2><p>這幾題沒有標準答案，也不用急著一次回答完。找一個安靜的時間，把答案寫下來。</p><ol class="ex">${r.qs.map(x=>`<li><div>${x}</div></li>`).join('')}</ol><p>接下來幾天，我會在信裡陪你，一題一題往下想。</p></div>
  <div class="letter"><h3>寫給你</h3><div style="margin-top:12px">${r.letter}</div><p class="sign"><b>Ginger Lin 林逸蓁</b>《把資歷變資產》作者</p></div>
  <div class="tools"><button class="btn line" id="pdf" type="button">存成 PDF</button><button class="btn line" id="again" type="button">重新檢查一次</button></div>
  <div class="foot"><span>本報告為自我覺察工具，結果僅供參考，不代表專業職涯評估。</span></div>`;
  noOrphan($('report'));
  show('report');
  try{ history.replaceState(null,'','#r'+code()); }catch(e){}
  requestAnimationFrame(()=>setTimeout(()=>{ const d=$('dot'); if(d) d.style.left = Math.max(3,Math.min(97,pos))+'%'; },120));
  $('again').addEventListener('click', ()=>{ if(CONFIG.mode!=='inline'){ location.href=CONFIG.checkUrl; return; } ans.fill(null); i=0; try{ history.replaceState(null,'',location.pathname); }catch(e){} renderQ(); show('quiz'); });
  $('pdf').addEventListener('click', ()=>{ try{ window.print(); }catch(e){} });
}

$('form').addEventListener('submit', e=>{
  e.preventDefault();
  const name = $('name').value.trim(), email = $('email').value.trim();
  const role = (document.querySelector('input[name=role]:checked')||{}).value || '一般工作者';
  if(!name){ $('err').textContent='請留下你的稱呼。'; $('name').focus(); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ $('err').textContent='請確認 Email 格式是否正確。'; $('email').focus(); return; }
  $('err').textContent='';
  const s = score(), t = typeOf(s);
  if(CONFIG.mode==='check'){
    const btn = $('form').querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = '正在產生你的報告…';
    sendKit(name,email,role,t,s).then(()=>{ location.href = CONFIG.reportUrl + '#r' + code(); });
    return;
  }
  sendKit(name,email,role,t,s);
  renderReport(name,t,s);
});

/* 專屬網址：#r 加 7 碼答案（例如 #r1232312），直接打開完整報告 */
const m = /^#r([123]{7})$/.exec(location.hash);
if(m){ m[1].split('').forEach((c,k)=>ans[k]=+c-1); const s=score(); renderReport('',typeOf(s),s); }
else if(CONFIG.mode==='report'){
  $('report').innerHTML = `<h1>你的資歷，<br>正在變成資產嗎？</h1><p class="lead">這裡是「資歷累積類型分析報告」的查看頁面。完成 7 題檢查之後，你的專屬報告會出現在這裡。</p><a class="btn" href="${CONFIG.checkUrl}">開始回答</a>`;
  show('report');
}

}
</script>
</body>
</html>
